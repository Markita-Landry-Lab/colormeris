<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Value Extractor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link href="assets/css/main.css" rel="stylesheet">
</head>

<body>
    <main>
        <div id="sidebar">
            <h2>Upload Image or PDF</h2>
            <div>
                <button id="zoomOutBtn" aria-label="Zoom Out">−</button>
                <button id="zoomInBtn" aria-label="Zoom In">+</button>
                <span id="zoomLevelDisplay">Zoom: 100%</span>
            </div>
            <input type="file" id="fileLoader" accept="image/*,application/pdf" />
            <label for="pageNumber">PDF Page Number:</label>
            <input type="number" id="pageNumber" min="1" value="1" />
            <label for="crossColor">Crosshair Color:</label>
            <select id="crossColor">
                <option value="red">Red</option>
                <option value="yellow">Yellow</option>
                <option value="black">Black</option>
                <option value="blue">Blue</option>
            </select>
            <div id="calibrationSection">
                <h3>Axis Calibration</h3>
                <div>
                    <label>Click order: X1 → X2 → Y1 → Y2</label>
                    <div id="calibrationStatus">Ready to click X1</div>
                </div>
                <div>
                    <label for="x1Value">X1 Value:</label>
                    <input type="number" id="x1Value" step="any" value="0" placeholder="e.g., 0">
                </div>
                <div>
                    <label for="x2Value">X2 Value:</label>
                    <input type="number" id="x2Value" step="any" value="1" placeholder="e.g., 1">
                </div>
                <div>
                    <label for="y1Value">Y1 Value:</label>
                    <input type="number" id="y1Value" step="any" value="0" placeholder="e.g., 0">
                </div>
                <div>
                    <label for="y2Value">Y2 Value:</label>
                    <input type="number" id="y2Value" step="any" value="1" placeholder="e.g., 1">
                </div>
                <button id="calibrateBtn">Calibrate</button>
                <button id="resetCalibrationBtn">Reset Calibration</button>
                <div id="calibrationInfo">Not calibrated</div>
            </div>

            <div id="dataPointsSection" style="display: none;">
                <h3>Data Points</h3>
                <button id="clearDataPointsBtn">Clear All Points</button>
                <div id="dataPointsList"></div>
            </div>
            <div id="pixelInfo">Click on the image to get pixel RGB values.</div>
            <div id="cursorLocation">Cursor location: (x, y)</div>
            <div id="cursorRGBA">RGBA: (hover over image)</div>
        </div>
        <div id="canvasContainer">
            <div id="mainCanvasWrapper">
                <canvas id="imageCanvas"></canvas>
            </div>
            <div id="rightColumn">
                <div id="zoomCanvasWrapper">
                    <canvas id="zoomCanvas"></canvas>
                </div>
                <div id="overviewCanvasWrapper">
                    <canvas id="overviewCanvas"></canvas>
                </div>
                <div id="pdfThumbnails">
                    <div class="thumbnails-grid"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.13.216/pdf.min.js"></script>
    <script type="module" src="assets/js/main.js"></script>
</body>

</html>
